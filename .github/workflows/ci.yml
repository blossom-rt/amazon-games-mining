name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: amazon-raw-${{ hashFiles('src/config.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Verify committed figure set
        run: python src/figure_pipeline.py --check

      - name: Download and verify raw data
        run: |
          python src/download.py
          python src/download.py --verify

      - name: Build parsed tables and features
        run: python src/run_all.py --only parse,scope,build_features

      - name: Check generated pipeline artifacts
        run: python src/run_all.py --check --require-all --only parse,scope,build_features
